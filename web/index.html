<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HoloStage</title>
<style>
  :root {
    --holo: #3fb9ff;
    --holo-dim: rgba(63, 185, 255, 0.45);
    --holo-faint: rgba(63, 185, 255, 0.18);
    --panel-bg: rgba(4, 12, 22, 0.82);
    /* 1.2.2: 控制面板等 App 界面固定青蓝，不随「配色」下拉变化 */
    --ui: #3fb9ff;
    --ui-dim: rgba(63, 185, 255, 0.45);
    --ui-faint: rgba(63, 185, 255, 0.18);
    --ui-line: rgba(63, 185, 255, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "SF Mono", Menlo, monospace; color: var(--ui); }

  /* ---------- 舞台（按所选比例居中） ---------- */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD 叠加层 ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; perspective: 1400px; }
  .ringWrap { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; color: var(--holo); }
  .ringWrap svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .ringSpin  { animation: spin 24s linear infinite; }
  .ringSpinRev { animation: spin 40s linear infinite reverse; }
  .ringSpinSlow { animation: spin 56s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #title {
    position: absolute; right: 26px; bottom: 40px;
    font-size: 26px; font-weight: 800; font-style: italic;
    letter-spacing: 0.22em; color: var(--holo);
    text-shadow: 0 0 12px var(--holo-dim);
    white-space: nowrap; max-width: 70%; overflow: hidden;
  }
  #titleRule {
    position: absolute; right: 26px; bottom: 34px; width: 260px; height: 2px;
    background: linear-gradient(90deg, var(--holo), transparent);
    box-shadow: 0 0 8px var(--holo-dim);
  }
  #bars { position: absolute; right: 26px; bottom: 12px; display: flex; gap: 3px; align-items: flex-end; }
  #bars span {
    width: 7px; background: var(--holo);
    box-shadow: 0 0 6px var(--holo-dim);
    animation: bar 1.6s ease-in-out infinite;
  }
  @keyframes bar { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

  .corner { position: absolute; width: 34px; height: 34px; border: 2px solid var(--holo-dim); }
  #c-tl { left: 14px; top: 14px; border-right: 0; border-bottom: 0; }
  #c-tr { right: 14px; top: 14px; border-left: 0; border-bottom: 0; }
  #c-bl { left: 14px; bottom: 14px; border-right: 0; border-top: 0; }
  #c-br { right: 14px; bottom: 14px; border-left: 0; border-top: 0; }

  #scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(63,185,255,0.02) 3px 4px);
  }

  /* ---------- 状态条（App 界面，固定色） ---------- */
  #status {
    position: absolute; left: 26px; bottom: 14px;
    font-size: 12px; letter-spacing: 0.12em; color: var(--ui-dim);
    text-shadow: 0 0 8px var(--ui-faint);
  }

  /* ---------- 拖放提示（App 界面，固定色） ---------- */
  #dropHint {
    position: absolute; inset: 0; display: none;
    border: 2px dashed var(--ui);
    background: rgba(63, 185, 255, 0.06);
    align-items: center; justify-content: center;
    font-size: 20px; letter-spacing: 0.3em; color: var(--ui);
    text-shadow: 0 0 14px var(--ui-dim); z-index: 40; pointer-events: none;
  }
  #dropHint.on { display: flex; }

  /* ---------- 控制面板（App 界面，固定青蓝，不随配色变） ---------- */
  #panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 248px;
    background: var(--panel-bg); border-left: 1px solid var(--ui-line);
    backdrop-filter: blur(6px); z-index: 30;
    padding: 14px 14px 20px; overflow-y: auto;
    transition: transform 0.25s ease;
    color: var(--ui);
  }
  #panel.hidden { transform: translateX(100%); }
  #panel h2 { font-size: 12px; letter-spacing: 0.3em; margin: 14px 0 8px; color: var(--ui-dim); border-bottom: 1px solid var(--ui-line); padding-bottom: 4px; }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; font-size: 12px; }
  .row label { color: var(--ui-dim); }
  input[type=range] { width: 110px; accent-color: var(--ui); }
  input[type=text], input[type=number], select {
    width: 100%; background: rgba(63,185,255,0.08); border: 1px solid var(--ui-line);
    color: var(--ui); padding: 5px 8px; font-family: inherit; font-size: 12px; letter-spacing: 0.1em;
  }
  input[type=checkbox] { accent-color: var(--ui); }
  .duo { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .duo input { width: 50%; }
  details.ring { margin: 6px 0; border: 1px solid var(--ui-line); padding: 4px 8px; }
  details.ring summary { cursor: pointer; font-size: 12px; letter-spacing: 0.2em; color: var(--ui); outline: none; }
  details.ring[open] summary { border-bottom: 1px solid var(--ui-line); padding-bottom: 6px; margin-bottom: 4px; }
  button {
    display: block; width: 100%; margin: 8px 0; padding: 8px;
    background: rgba(63,185,255,0.10); border: 1px solid var(--ui-line);
    color: var(--ui); font-family: inherit; font-size: 12px; letter-spacing: 0.2em;
    cursor: pointer; text-transform: uppercase;
  }
  button:hover { background: rgba(63,185,255,0.25); }
  button:disabled { opacity: 0.4; cursor: default; }
  #panelToggle {
    position: absolute; right: 12px; top: 12px; z-index: 35;
    width: auto; margin: 0; padding: 6px 12px; display: none;
  }
  #panel.hidden ~ #panelToggle { display: block; }

  #fileInput { display: none; }
  #err { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(60,0,10,0.85); border: 1px solid #ff4d5e; color: #ff8d98; padding: 10px 18px; font-size: 12px; z-index: 50; display: none; max-width: 70%; }

  /* ---------- 界面配色（1.2.3） ---------- */
  .uc-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 2px; font-size: 12px; }
  .uc-row label { color: var(--ui-dim); }
  .uc-row .uc-head { display: flex; align-items: center; gap: 6px; }
  .uc-swatch { width: 26px; height: 18px; padding: 0; border: 1px solid var(--ui-line); background: none; cursor: pointer; }
  .uc-swatch::-webkit-color-swatch-wrapper { padding: 1px; }
  .uc-swatch::-webkit-color-swatch { border: none; }
  .uc-inp {
    width: 100%; background: rgba(63,185,255,0.08); border: 1px solid var(--ui-line);
    color: var(--ui); padding: 4px 8px; font-family: inherit; font-size: 11px; letter-spacing: 0.06em;
  }
  .uc-inp.bad { border-color: #ff4d5e; color: #ff8d98; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">
      <div class="ringWrap" id="ringWrap1"></div>
      <div class="ringWrap" id="ringWrap2"></div>
      <div class="ringWrap" id="ringWrap3"></div>
      <div id="title">HOLOSTAGE</div>
      <div id="titleRule"></div>
      <div id="bars"></div>
      <div class="corner" id="c-tl"></div><div class="corner" id="c-tr"></div>
      <div class="corner" id="c-bl"></div><div class="corner" id="c-br"></div>
      <div id="scanline"></div>
    </div>
  </div>

  <div id="status">NO MODEL LOADED — 拖入 STL / OBJ / glTF / GLB / PLY / FBX / PMX / USDZ / ZIP，可切换线框 / 全彩</div>
  <div id="dropHint">释放以载入模型</div>
  <div id="err"></div>

  <div id="panel">
    <h2>模型</h2>
    <button id="btnHide">收起面板</button>
    <button id="btnOpen">打开模型文件</button>
    <div class="row"><label>标题</label></div>
    <input type="text" id="inpTitle" value="HOLOSTAGE">
    <div class="row"><label>位置 X</label><span id="valPX">0.00</span></div>
    <input type="range" id="inpPX" min="-200" max="200" value="0" style="width:100%">
    <div class="row"><label>位置 Y</label><span id="valPY">0.00</span></div>
    <input type="range" id="inpPY" min="-200" max="200" value="0" style="width:100%">
    <div class="row"><label>位置 Z</label><span id="valPZ">0.00</span></div>
    <input type="range" id="inpPZ" min="-200" max="200" value="0" style="width:100%">

    <h2>全息风格</h2>
    <div class="row"><label>配色</label></div>
    <select id="selPreset">
      <option value="cyan" selected>青蓝（默认）</option>
      <option value="green">荧光绿（暴龙机）</option>
      <option value="red">红</option>
      <option value="gold">金</option>
      <option value="ice">冰蓝</option>
    </select>
    <div class="row"><label>渲染方式</label></div>
    <select id="selRender">
      <option value="wire" selected>线框全息</option>
      <option value="full">全彩（原材质）</option>
    </select>
    <div id="wireOnly">
      <div class="row"><label>线框模式</label><span id="valMode">全网格</span></div>
      <button id="btnMode">切换 边缘 / 全网格</button>
      <div class="row"><label>折痕阈值</label><span id="valAngle">32°</span></div>
      <input type="range" id="inpAngle" min="1" max="80" value="32" style="width:100%">
    </div>
    <div id="fullOnly" style="display:none">
      <div class="row"><label>全彩氛围</label><input type="checkbox" id="inpAtmo" checked></div>
    </div>
    <div class="row"><label>辉光强度</label><span id="valBloom">0.9</span></div>
    <input type="range" id="inpBloom" min="0" max="30" value="9" style="width:100%">
    <div class="row"><label>模型缩放</label><span id="valScale">1.0</span></div>
    <input type="range" id="inpScale" min="30" max="1000" value="100" style="width:100%">
    <div class="row"><label>Z 轴朝上</label><input type="checkbox" id="inpZup"></div>
    <button id="btnReset">重置变换</button>

    <h2>界面配色（#RRGGBB，auto=跟随配色）</h2>
    <div id="uiColorList"></div>
    <button id="btnUIColorReset">全部恢复 auto</button>

    <h2>场景</h2>
    <div class="row"><label>转速</label><span id="valSpeed">0.5</span></div>
    <input type="range" id="inpSpeed" min="0" max="20" value="5" style="width:100%">
    <div class="row"><label>网格地台</label><input type="checkbox" id="inpGrid" checked></div>
    <div class="row"><label>HUD 叠加层</label><input type="checkbox" id="inpHud" checked></div>

    <h2>全息环 ①（分段弧）</h2>
    <details class="ring" open>
      <summary>① 号环</summary>
      <div class="row"><label>位置 X</label><span id="valR1X">0</span></div>
      <input type="range" class="ringCtl" data-ring="1" data-k="x" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>位置 Y</label><span id="valR1Y">0</span></div>
      <input type="range" class="ringCtl" data-ring="1" data-k="y" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>大小 %</label><span id="valR1S">100</span></div>
      <input type="range" class="ringCtl" data-ring="1" data-k="s" min="20" max="160" value="100" style="width:100%">
      <div class="row"><label>俯仰角</label><span id="valR1P">0°</span></div>
      <input type="range" class="ringCtl" data-ring="1" data-k="p" min="-80" max="80" value="0" style="width:100%">
      <div class="row"><label>滚转角</label><span id="valR1R">0°</span></div>
      <input type="range" class="ringCtl" data-ring="1" data-k="r" min="-80" max="80" value="0" style="width:100%">
    </details>
    <h2>全息环 ②（刻度盘）</h2>
    <details class="ring" open>
      <summary>② 号环</summary>
      <div class="row"><label>位置 X</label><span id="valR2X">0</span></div>
      <input type="range" class="ringCtl" data-ring="2" data-k="x" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>位置 Y</label><span id="valR2Y">0</span></div>
      <input type="range" class="ringCtl" data-ring="2" data-k="y" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>大小 %</label><span id="valR2S">100</span></div>
      <input type="range" class="ringCtl" data-ring="2" data-k="s" min="20" max="160" value="100" style="width:100%">
      <div class="row"><label>俯仰角</label><span id="valR2P">0°</span></div>
      <input type="range" class="ringCtl" data-ring="2" data-k="p" min="-80" max="80" value="0" style="width:100%">
      <div class="row"><label>滚转角</label><span id="valR2R">0°</span></div>
      <input type="range" class="ringCtl" data-ring="2" data-k="r" min="-80" max="80" value="0" style="width:100%">
    </details>
    <h2>全息环 ③（虚线环）</h2>
    <details class="ring">
      <summary>③ 号环</summary>
      <div class="row"><label>位置 X</label><span id="valR3X">0</span></div>
      <input type="range" class="ringCtl" data-ring="3" data-k="x" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>位置 Y</label><span id="valR3Y">0</span></div>
      <input type="range" class="ringCtl" data-ring="3" data-k="y" min="-500" max="500" value="0" style="width:100%">
      <div class="row"><label>大小 %</label><span id="valR3S">86</span></div>
      <input type="range" class="ringCtl" data-ring="3" data-k="s" min="20" max="160" value="86" style="width:100%">
      <div class="row"><label>俯仰角</label><span id="valR3P">18°</span></div>
      <input type="range" class="ringCtl" data-ring="3" data-k="p" min="-80" max="80" value="18" style="width:100%">
      <div class="row"><label>滚转角</label><span id="valR3R">-12°</span></div>
      <input type="range" class="ringCtl" data-ring="3" data-k="r" min="-80" max="80" value="-12" style="width:100%">
    </details>

    <h2>画面</h2>
    <div class="row"><label>画面比例</label></div>
    <select id="selRatio">
      <option value="16:9">16:9</option>
      <option value="3:2" selected>3:2（参考图）</option>
      <option value="4:3">4:3</option>
      <option value="1:1">1:1</option>
      <option value="9:16">9:16 竖屏</option>
      <option value="custom">自定义…</option>
    </select>
    <div class="duo" id="ratioCustom" style="display:none">
      <input type="number" id="ratioW" value="3" min="1" max="99">
      <span>:</span>
      <input type="number" id="ratioH" value="2" min="1" max="99">
    </div>
    <div class="row"><label>导出分辨率</label></div>
    <select id="selRes">
      <option value="720">720p</option>
      <option value="1080" selected>1080p</option>
      <option value="1440">2K</option>
      <option value="2160">4K</option>
      <option value="custom">自定义…</option>
    </select>
    <div class="duo" id="resCustom" style="display:none">
      <input type="number" id="resW" value="1920" min="64" max="7680">
      <span>×</span>
      <input type="number" id="resH" value="1080" min="64" max="7680">
    </div>

    <h2>导出</h2>
    <div class="row"><label>帧数</label><span id="valFrames">24</span></div>
    <input type="range" id="inpFrames" min="4" max="120" value="24" style="width:100%">
    <div class="row"><label>帧延时 ms</label><span id="valDelay">100</span></div>
    <input type="range" id="inpDelay" min="20" max="500" value="100" style="width:100%">
    <button id="btnGif">导出 GIF 动画</button>
    <button id="btnSeq">导出 PNG 帧序列</button>
    <button id="btnShot">导出当前帧 PNG</button>
  </div>
  <button id="panelToggle" onclick="document.getElementById('panel').classList.remove('hidden')">面板</button>

  <input type="file" id="fileInput" accept=".stl,.obj,.gltf,.glb,.ply,.fbx,.pmx,.pmd,.usdz,.zip">
  <script src="lib/gif.js"></script>
  <script src="lib/tinyusdz-glue.js"></script>
  <script src="lib/bundle.js"></script>
</body>
</html>
